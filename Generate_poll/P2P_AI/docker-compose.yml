version: "3.8"

services:
  backend:
    image: django_backend:latest 
    build: .
    container_name: django_backend
    depends_on:
      - db  
    ports:
      - "8003:8003"
    volumes:
      - .:/app  
      - ./db.sqlite3:/app/db.sqlite3  
    env_file:
      - .env 
    restart: always

  db:
    image: postgres:14  
    container_name: postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    env_file:
      - .env  
    restart: always

volumes:
  postgres_data:
