AWSTemplateFormatVersion: '2010-09-09'
Description: "Poll Service for P2P Bets"
Transform: AWS::Serverless-2016-10-31

Parameters:
  EnvironmentName:
    Type: String
    Description: "Name of the target environment (e.g., dev or prod)"
  PollFunctionArn:
    Type: String
    Description: "ARN of the Poll Lambda function"


Resources:
  PollApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      PollFunctionPermission:
        Type: AWS::Lambda::Permission
        Properties:
          Action: 'lambda:InvokeFunction'
          Principal: 'apigateway.amazonaws.com'
          FunctionName: !Ref PollFunctionArn
      DefinitionBody:
        swagger: "2.0"
        info:
          title: "Poll Service API"
          version: "2018-11-29"
        paths:
          /poll:
            get:
              responses:
                '200':
                  description: "200 response"
                  schema:
                    $ref: "#/definitions/Empty"
              x-amazon-apigateway-integration:
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PollFunctionArn}/invocations"
                passthroughBehavior: "when_no_match"
                httpMethod: "POST"
                type: "aws_proxy"
        definitions:
          Empty:
            type: "object"
            title: "Empty Schema"